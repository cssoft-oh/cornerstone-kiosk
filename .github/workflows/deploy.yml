# ─────────────────────────────────────────────────────────────────
# Auto-deploy Cornerstone Kiosk to Azure Static Web Apps on push to main.
# PRs get a temporary preview environment. Main pushes go to production.
# Requires repo secret: AZURE_STATIC_WEB_APPS_API_TOKEN_KIOSK
#   (fetched via: az staticwebapp secrets list --name swa-cornerstone-kiosk
#                 -g rg-cornerstone-kiosk-prod --query properties.apiKey -o tsv)
# The kiosk is pure static — no build, no api. Vite is not required.
# ─────────────────────────────────────────────────────────────────
name: Deploy Kiosk to Azure SWA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIOSK }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: '.'
          api_location: ''
          output_location: ''
          skip_app_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIOSK }}
          action: close
